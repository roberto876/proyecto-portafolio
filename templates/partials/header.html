{% load static %}
<header class="header">
  <div class="container header__inner">
    <button type="button" class="icon-btn header__burger" data-open-menu aria-label="Abrir menú" aria-controls="mobile-menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M3 6h18M3 12h18M3 18h18"/>
      </svg>
    </button>

    <a class="logo" href="{% url 'store:home' %}">{% include 'partials/logo.html' %}</a>

    <nav class="nav" aria-label="Navegación principal">
      <a class="nav__link" href="{% url 'store:home' %}"{% if request.resolver_match.url_name == 'home' %} aria-current="page"{% endif %}>Inicio</a>
      <a class="nav__link" href="{% url 'store:product_list' %}"{% if request.resolver_match.url_name == 'product_list' %} aria-current="page"{% endif %}>Tienda</a>
      <a class="nav__link" href="{% url 'store:product_list' %}?genero=H">Hombre</a>
      <a class="nav__link" href="{% url 'store:product_list' %}?genero=M">Mujer</a>
      <a class="nav__link" href="{% url 'store:offers' %}"{% if request.resolver_match.url_name == 'offers' %} aria-current="page"{% endif %}>Ofertas</a>
      <a class="nav__link" href="{% url 'store:about' %}">Nosotros</a>
      <a class="nav__link" href="{% url 'store:contact' %}">Contacto</a>
    </nav>

    <div class="header__actions">
      <button type="button" class="icon-btn" data-open-search aria-label="Buscar productos" aria-controls="search-panel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
        </svg>
      </button>

      {% if user.is_authenticated %}
        <a class="icon-btn" href="{% url 'accounts:profile' %}" aria-label="Mi cuenta">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
          </svg>
        </a>
      {% else %}
        <a class="icon-btn" href="{% url 'accounts:login' %}" aria-label="Iniciar sesión">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
          </svg>
        </a>
      {% endif %}

      <button type="button" class="icon-btn" data-open-cart aria-label="Abrir carrito" aria-controls="minicart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 2H2"/>
          <circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/>
        </svg>
        <span class="cart-count" id="cart-count"{% if not cart|length %} hidden{% endif %}>{{ cart|length }}</span>
      </button>
    </div>
  </div>
</header>
