{% extends 'base.html' %}

{% block title %}500 — Error del servidor{% endblock %}

{% block content %}
<div class="container">

    <p class="error-page__code">500</p>
    <h1 style="margin-top:1rem">Error del servidor</h1>
    <p class="text-muted" style="margin-top:1rem;max-width:46ch;margin-inline:auto">
